[package]
name = "suica-viewer-app"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Suica Viewer Tauri desktop application"
authors = ["KIRISHIKI Yudai <yudai.kirishiki@protonmail.com>"]
license = "MIT"

[features]
# `tauri build` enables this feature so the Vite output is embedded in the
# desktop executable. Development builds keep using Vite's dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
suica-viewer = { path = ".." }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri = { version = "2", features = [] }
env_logger = "0.11"
