[workspace]
resolver = "3"
members = ["src-tauri"]

[package]
name = "suica-viewer"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "FeliCa 交通系ICカードの詳細情報を読み取って表示するビューア"
authors = ["KIRISHIKI Yudai <yudai.kirishiki@protonmail.com>"]
license = "MIT"
readme = "README.md"
default-run = "suica-viewer-cli"

[[bin]]
name = "suica-viewer-cli"
path = "src/bin/cli.rs"

[dependencies]
felica = "1.0"

# Card reading / decoding
encoding_rs = "0.8"
hex = "0.4"

# Auth-server relay. ureq is blocking, so the reader thread can drive the
# request/response ping-pong without an async runtime. Its `rustls` feature
# pulls in the webpki (Mozilla) root store, which compiles the CA set into the
# binary the way certifi did for the frozen Python builds.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "json",
] }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }

# CLI
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"

log = "0.4"
env_logger = "0.11"
thiserror = "2.0.19"

[profile.release]
strip = true
